{% extends "base.html" %}

{% block title %}
Payment Failed
{% endblock %}

{% block content %}

<div style="text-align:center; margin-top:80px;">

    <h1 style="color:red;">
        Payment Failed
    </h1>

    <p>
        Your payment could not be completed.
    </p>

    <a href="{% url 'checkout' %}"
       style="
       background:#ff9900;
       color:white;
       padding:12px 25px;
       text-decoration:none;
       border-radius:5px;">
        Try Again
    </a>

</div>

{% endblock %}
