{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link rel="stylesheet"
          href="{% static 'css/edit_product.css' %}">

</head>

<body>

<div class="container">

    <!-- PAGE HEADER -->

    <div class="page-header">

        <h1>
            Edit Product
        </h1>

        <a href="{% url 'admin_products' %}"
           class="back-btn">

            ← Back to Products

        </a>

    </div>


    <!-- FORM -->

    <div class="form-card">

        <form method="POST">

            {% csrf_token %}


            <!-- Product Name -->

            <div class="form-group">

                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ product.name }}"
                    placeholder="Enter product name"
                    required
                >

            </div>


            <!-- Category -->

            <div class="form-group">

                <label>
                    Category
                </label>

                <select name="category" required>

                    {% for value, label in categories %}

                        <option
                            value="{{ value }}"
                            {% if product.category == value %}
                                selected
                            {% endif %}
                        >

                            {{ label }}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Price -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input
                        type="number"
                        name="price"
                        value="{{ product.price }}"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>


                <!-- Original Price -->

                <div class="form-group">

                    <label>
                        Original Price
                    </label>

                    <input
                        type="number"
                        name="original_price"
                        value="{{ product.original_price }}"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>

            </div>


            <!-- Discount + Stock -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Discount (%)
                    </label>

                    <input
                        type="number"
                        name="discount"
                        value="{{ product.discount }}"
                        min="0"
                        max="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Stock
                    </label>

                    <input
                        type="number"
                        name="stock"
                        value="{{ product.stock }}"
                        min="0"
                        required
                    >

                </div>

            </div>


            <!-- Image -->

            <div class="form-group">

                <label>
                    Image URL
                </label>

                <input
                    type="url"
                    name="image"
                    value="{{ product.image }}"
                    placeholder="https://example.com/product.jpg"
                    required
                >

            </div>


            <!-- Description -->

            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    name="description"
                    rows="6"
                    placeholder="Enter product description"
                    required
                >{{ product.description }}</textarea>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <a href="{% url 'admin_products' %}"
                   class="cancel-btn">

                    Cancel

                </a>


                <button
                    type="submit"
                    class="update-product-btn">

                    Update Product

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
