{% extends "base.html" %}

{% block title %}
Pay Online
{% endblock %}

{% block content %}

<div style="
    max-width:700px;
    margin:50px auto;
    padding:40px;
    background:white;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    text-align:center;
">

    <h1 style="color:#0879f9;">
        💳 Pay Online
    </h1>

    <hr>

    <h2>
        Order #{{ order.id }}
    </h2>

    <h2 style="color:#c45500;">
        Amount: ₹{{ order.total_price }}
    </h2>

    <p>
        <b>Payment Method:</b>
        UPI / Card
    </p>

    <br>

    <button
        id="rzp-button"
        style="
            padding:15px 45px;
            background:#0879f9;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
        "
    >
        💳 Pay ₹{{ order.total_price }}
    </button>

</div>


<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

var options = {

    "key": "{{ key }}",

    "amount": "{{ razorpay_order.amount }}",

    "currency": "INR",

    "name": "Amazon Clone",

    "description": "Payment for Order #{{ order.id }}",

    "order_id": "{{ razorpay_order.id }}",

    "prefill": {

        "name": "{{ order.full_name }}",

        "contact": "{{ order.phone }}"

    },

    "theme": {

        "color": "#0879f9"

    },


    "handler": function (response) {

        console.log(
            "Razorpay Payment Successful"
        );

        console.log(response);


        var form =
            document.createElement("form");

        form.method = "POST";

        form.action =
            "{% url 'payment_success' %}";


        // CSRF
        var csrf =
            document.createElement("input");

        csrf.type = "hidden";

        csrf.name =
            "csrfmiddlewaretoken";

        csrf.value =
            "{{ csrf_token }}";

        form.appendChild(csrf);


        // Payment ID
        var payment_id =
            document.createElement("input");

        payment_id.type = "hidden";

        payment_id.name =
            "razorpay_payment_id";

        payment_id.value =
            response.razorpay_payment_id;

        form.appendChild(payment_id);


        // Razorpay Order ID
        var order_id =
            document.createElement("input");

        order_id.type = "hidden";

        order_id.name =
            "razorpay_order_id";

        order_id.value =
            response.razorpay_order_id;

        form.appendChild(order_id);


        // Signature
        var signature =
            document.createElement("input");

        signature.type = "hidden";

        signature.name =
            "razorpay_signature";

        signature.value =
            response.razorpay_signature;

        form.appendChild(signature);


        document.body.appendChild(form);

        form.submit();

    },


    "modal": {

        "ondismiss": function () {

            console.log(
                "Payment window closed"
            );

        }

    }

};


var rzp1 =
    new Razorpay(options);


document.getElementById(
    "rzp-button"
).onclick = function(e) {

    rzp1.open();

    e.preventDefault();

};

</script>

{% endblock %}
